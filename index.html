<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonder</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>SONDER</h1>
<nav>
<a href="#shop">Shop</a>
<a href="#about">About</a>
<a onclick="toggleCart()">Cart</a>
</nav>
<div id="cartCount">0</div>
</header>

<section class="hero">
<h2>Every story matters</h2>
<p>Streetwear inspired by individuality</p>
<a href="#shop"><button>Shop Now</button></a>
</section>

<section id="shop" class="products">

<div class="card" onclick="openProduct('Hoodie',80)">
<img src="images/hoodie.jpg">
<h3>Hoodie</h3>
<p>$80</p>
</div>

<div class="card" onclick="openProduct('T-Shirt',45)">
<img src="images/tshirt.jpg">
<h3>T-Shirt</h3>
<p>$45</p>
</div>

<div class="card" onclick="openProduct('Pants',95)">
<img src="images/pants.jpg">
<h3>Pants</h3>
<p>$95</p>
</div>

</section>

<section id="about" class="about">
<h2>About</h2>
<p>Sonder represents the idea that every person lives a life as vivid and complex as your own.</p>
</section>

<!-- PRODUCT POPUP -->
<div id="productPage" class="productPage">
<h2 id="productName"></h2>
<p id="productPrice"></p>
<button onclick="addToCart()">Add to Cart</button>
<button onclick="closeProduct()">Close</button>
</div>

<!-- CART -->
<div id="cart" class="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3 id="total">Total: $0</h3>
<button onclick="checkout()">Checkout</button>
</div>

<footer>© 2026 Sonder</footer>

<script src="script.js"></script>
</body>
</html>
